name: build

on:
  workflow_dispatch:

env:
  SDK_PATH: ${{ github.workspace }}/_sdk/ps5-payload-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Cache PS5 Payload SDK
      id: cache-sdk
      uses: actions/cache@v4
      with:
        path: ${{ env.SDK_PATH }}
        key: ps5-payload-sdk-v1
        restore-keys: |
          ps5-payload-sdk-

    - name: Install prerequisites
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 lld-18

    - name: Build PS5 Payload SDK
      if: steps.cache-sdk.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://github.com/ps5-payload-dev/sdk.git /tmp/ps5-sdk
        cd /tmp/ps5-sdk
        export PS5_PAYLOAD_SDK="${{ env.SDK_PATH }}"
        export DESTDIR="${{ env.SDK_PATH }}"
        make install
        ./libcxx.sh

    - name: Build Ghostcontrol
      run: make -C payload clean all
      env:
        PS5_PAYLOAD_SDK: ${{ env.SDK_PATH }}

    - name: Rename artifact
      run: cp payload/ghost-control-xbox-ps5.elf Ghostcontrol.elf

    - name: Upload ELF
      uses: actions/upload-artifact@v4
      with:
        name: Ghostcontrol
        path: Ghostcontrol.elf
        if-no-files-found: error
